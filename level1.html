<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المستوى الأول</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Cairo,sans-serif;
}

body{
background:linear-gradient(135deg,#0f172a,#1e293b,#2563eb);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
color:white;
}

.container{
width:90%;
max-width:900px;
text-align:center;
}

h1{
margin-bottom:40px;
font-size:40px;
}

.parts{
display:flex;
justify-content:center;
gap:20px;
flex-wrap:wrap;
}

.part{
background:rgba(255,255,255,0.92);
padding:30px;
width:300px;
border-radius:20px;
transition:.3s;
cursor:pointer;
text-decoration:none;
color:#1e293b;
box-shadow: 0 4px 20px rgba(0,0,0,0.3);
}

.part:hover{
transform:translateY(-10px);
background:white;
box-shadow: 0 8px 30px rgba(0,0,0,0.4);
}

.part h2{
margin-bottom:15px;
color:#1e3a8a;
font-size:22px;
}

.part p{
color:#334155;
font-size:15px;
}
</style>
</head>

<body>

<div class="container">

<h1>المستوى الأول</h1>

<div class="parts">

<a href="book1.pdf" target="_blank" class="part">
<h2>📘 الجزء الأول</h2>
<p>كتاب الطالب - الجزء الأول</p>
</a>

<a href="book2.pdf" target="_blank" class="part">
<h2>📗 الجزء الثاني</h2>
<p>كتاب الطالب - الجزء الثاني</p>
</a>

</div>
</div>

</body>
</html>
